name: D1 import connectivity
on:
  push:
    branches: [main]
    paths: [knowledge/d1-import-lab.json]
permissions:
  contents: read
  id-token: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import exact commit and verify D1
        env:
          IMPORT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse, time
          base = "https://d1-api-lab.kkulka.chatgpt.site"
          audience = base + "/api/imports"
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(audience, safe="")
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req, timeout=20) as response:
              token = json.load(response)["value"]
          sha = os.environ["IMPORT_COMMIT"]
          path = "knowledge/d1-import-lab.json"
          def call(method, route, payload=None):
              config = ["url = " + json.dumps(base + route), "request = " + json.dumps(method), "header = " + json.dumps("Authorization: Bearer " + token)]
              if payload is not None:
                  config += ['header = "Content-Type: application/json"', "data-binary = " + json.dumps(json.dumps(payload))]
              for attempt in range(1, 5):
                  result = subprocess.run(["curl", "-sS", "--max-time", "40", "--config", "-", "-w", "\\n%{http_code}"], input="\n".join(config)+"\n", capture_output=True, text=True)
                  body, _, code = result.stdout.rpartition("\n")
                  status = int(code) if code.isdigit() else 0
                  print(f"{method} attempt={attempt} HTTP={status}", flush=True)
                  if result.returncode == 0 and status in (200, 201):
                      return json.loads(body)
                  if status not in (0, 429, 502, 503, 504) or attempt == 4:
                      raise SystemExit(f"Import request failed: HTTP {status}, curl exit {result.returncode}")
                  time.sleep(2 ** attempt)
          imported = call("POST", "/api/imports", {"file": path, "commit": sha})
          if imported.get("status") not in ("imported", "already_imported"):
              raise SystemExit("Unexpected import result")
          print("Import result: " + imported["status"])
          state = call("GET", "/api/imports?file=" + urllib.parse.quote(path))
          if state.get("source", {}).get("head") != sha or not state.get("records"):
              raise SystemExit("D1 verification failed")
          ids = [r["id"] for r in state["records"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate IDs in D1")
          print(f"D1 verified: commit={sha}, records={len(ids)}, unique IDs={len(set(ids))}")
          PY
