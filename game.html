<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kula w Pudełku</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script type="module">
    // Import modułów
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js";
    import * as CANNON from "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js";

    // Scena Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Świat fizyczny Cannon.js
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    // --- (Opcjonalnie) Definiujemy materiały oraz contact material, aby ustawić restitution ---
    const ballMat = new CANNON.Material("ball");
    const groundMat = new CANNON.Material("ground");

    const ballGroundContactMaterial = new CANNON.ContactMaterial(
      ballMat,
      groundMat,
      { restitution: 0.9 }
    );
    world.defaultContactMaterial = ballGroundContactMaterial;
    // -------------------------------------------------------------------------------

    // Podłoga
    const groundShape = new CANNON.Plane();
    const groundBody = new CANNON.Body({
      mass: 0,
      shape: groundShape,
      position: new CANNON.Vec3(0, -5, 0),
      material: groundMat
    });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // Ściany pudełka (wokół)
    function createWall(x, y, z, rotationY) {
      const wallShape = new CANNON.Box(new CANNON.Vec3(5, 5, 0.1));
      const wallBody = new CANNON.Body({
        mass: 0,
        shape: wallShape,
        position: new CANNON.Vec3(x, y, z)
      });
      wallBody.quaternion.setFromEuler(0, rotationY, 0);
      world.addBody(wallBody);

      const geometry = new THREE.BoxGeometry(10, 10, 0.2);
      const material = new THREE.MeshStandardMaterial({
        color: 0x888888,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }

    createWall(0, 0, -5, 0); // Ściana tylna
    createWall(0, 0, 5, 0); // Ściana przednia
    createWall(-5, 0, 0, Math.PI / 2); // Ściana lewa
    createWall(5, 0, 0, Math.PI / 2); // Ściana prawa

    // Kula
    const ballShape = new CANNON.Sphere(0.5);
    const ballBody = new CANNON.Body({
      mass: 1,
      shape: ballShape,
      position: new CANNON.Vec3(0, 2, 0),
      material: ballMat
    });
    world.addBody(ballBody);

    const ballGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const ballMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const ballMesh = new THREE.Mesh(ballGeometry, ballMaterial);
    scene.add(ballMesh);

    // Przeszkody (np. szklanki)
    function createObstacle(x, y, z) {
      const obstacleShape = new CANNON.Cylinder(0.3, 0.3, 1, 12);
      const obstacleBody = new CANNON.Body({
        mass: 0, // Statyczne przeszkody
        shape: obstacleShape,
        position: new CANNON.Vec3(x, y, z)
      });
      world.addBody(obstacleBody);

      const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1, 12);
      const material = new THREE.MeshStandardMaterial({ color: 0x0000ff });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }

    createObstacle(1, -4, 1);
    createObstacle(-1, -4, -1);
    createObstacle(2, -4, -2);

    // Oświetlenie
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    // Pozycja kamery
    camera.position.set(0, 0, 10);
    camera.lookAt(new THREE.Vector3(0, 0, 0));

    // Animacja
    function animate() {
      requestAnimationFrame(animate);
      world.step(1 / 60);

      // Aktualizacja pozycji i rotacji kuli
      ballMesh.position.copy(ballBody.position);
      ballMesh.quaternion.copy(ballBody.quaternion);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
