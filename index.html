<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Prosty korytarz 3D</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10151d); scene.fog=new THREE.Fog(0x10151d,12,75);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120); camera.position.set(0,1.7,6);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8d7ff,0x30261c,1.5));
const lamp=new THREE.PointLight(0xffd9a0,2.4,24); lamp.position.set(0,4.2,0); scene.add(lamp);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,120),new THREE.MeshStandardMaterial({color:0x4a5058,roughness:.9})); floor.rotation.x=-Math.PI/2; floor.position.z=-45; scene.add(floor);
const wallMaterial=new THREE.MeshStandardMaterial({color:0x8b929b,roughness:.82});
for(const x of [-6,6]){const wall=new THREE.Mesh(new THREE.BoxGeometry(.35,6,120),wallMaterial);wall.position.set(x,3,-45);scene.add(wall)}
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(12,120),new THREE.MeshStandardMaterial({color:0x343a43,roughness:1})); ceiling.rotation.x=Math.PI/2; ceiling.position.set(0,6,-45); scene.add(ceiling);
for(let z=0;z>-115;z-=10){const light=new THREE.PointLight(0xffc77b,1.3,11);light.position.set(0,5.1,z);scene.add(light)}
let yaw=0,pitch=0,moving=false,pointerId=null,lastX=0,lastY=0; const lookSpeed=.0035,moveSpeed=.075;
function updateCamera(){camera.rotation.set(pitch,yaw,0,'YXZ')}
renderer.domElement.addEventListener('pointerdown',e=>{pointerId=e.pointerId;lastX=e.clientX;lastY=e.clientY;moving=true;renderer.domElement.setPointerCapture(pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==pointerId)return;yaw-=(e.clientX-lastX)*lookSpeed;pitch-=(e.clientY-lastY)*lookSpeed;pitch=THREE.MathUtils.clamp(pitch,-Math.PI/2+.05,Math.PI/2-.05);lastX=e.clientX;lastY=e.clientY;updateCamera()});
function stopMoving(e){if(e.pointerId!==pointerId)return;moving=false;pointerId=null;if(renderer.domElement.hasPointerCapture(e.pointerId))renderer.domElement.releasePointerCapture(e.pointerId)}
renderer.domElement.addEventListener('pointerup',stopMoving); renderer.domElement.addEventListener('pointercancel',stopMoving); renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const delta=Math.min(clock.getDelta(),.05);if(moving){camera.position.x-=Math.sin(yaw)*moveSpeed*delta*60;camera.position.z-=Math.cos(yaw)*moveSpeed*delta*60;camera.position.y=1.7}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); updateCamera(); animate();
</script>
</body>
</html>
