<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korytarz 3D — wybór wersji</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#10151d;color:#e8edf3;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(680px,100%)}
    h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15}
    .intro{margin:0 0 28px;color:#aeb9c7}
    .versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    a{display:block;padding:20px;border:1px solid #3c4b5c;border-radius:10px;background:#192331;color:inherit;text-decoration:none}
    a:hover,a:focus-visible{border-color:#9cc8ec;background:#202f40;outline:none}
    strong{display:block;margin-bottom:6px;font-size:1.15rem}
    span{color:#b9c5d2}
  </style>
</head>
<body>
<main>
  <h1>Korytarz 3D</h1>
  <p class="intro">Wybierz wersję prototypu:</p>
  <nav class="versions" aria-label="Wersje projektu">
    <a href="v1/">
      <strong>v1 — stabilna</strong>
      <span>Geiger i kolizje. Zamrożona wersja projektu.</span>
    </a>
    <a href="v2/">
      <strong>v2 — eksperymentalna</strong>
      <span>Kopia wersji v1 przeznaczona do dalszego rozwoju.</span>
    </a>
  </nav>
</main>
</body>
</html>
